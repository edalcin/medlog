name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: git.dalc.in
  IMAGE_NAME: edalcin/medlog

jobs:
  quality:
    runs-on: docker
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        run: npm run build
      - name: Placeholder tests
        run: echo "(Adicionar testes futuramente)"
        continue-on-error: true
  build-and-push:
    runs-on: docker
    needs: quality
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=unraid-test,enable=true
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate CHANGELOG fragment (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "# Release $GITHUB_REF_NAME" > RELEASE_NOTES.md
          echo >> RELEASE_NOTES.md
          echo "Imagem: git.dalc.in/${{ env.IMAGE_NAME }}:$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          echo >> RELEASE_NOTES.md
          echo "Commit: $GITHUB_SHA" >> RELEASE_NOTES.md
          echo >> RELEASE_NOTES.md
          echo "(Gerar changelog detalhado quando houver conventional commits)" >> RELEASE_NOTES.md
      - name: Create Forgejo Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: akkuman/gitea-release-action@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
